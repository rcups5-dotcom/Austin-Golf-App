<style>
:root{
  --bg:#EEF1EA; --panel:#FFFFFF; --ink:#17261E; --mute:#52645A; --line:#CDD6CB;
  --accent:#1F5E3A; --accent-ink:#FFFFFF; --soft:#E1E9DF;
  --crit:#B83227; --mod:#9A6A12; --low:#52645A; --water:#2F79A6; --sand:#B89B4C;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1914; --panel:#17251D; --ink:#E7EEE6; --mute:#9DB0A2; --line:#2A3C31;
    --accent:#5BB37E; --accent-ink:#0F1914; --soft:#1F3126;
    --crit:#F0705F; --mod:#E0B04F; --low:#9DB0A2; --water:#6DB3DB; --sand:#CDB873;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1914; --panel:#17251D; --ink:#E7EEE6; --mute:#9DB0A2; --line:#2A3C31;
  --accent:#5BB37E; --accent-ink:#0F1914; --soft:#1F3126;
  --crit:#F0705F; --mod:#E0B04F; --low:#9DB0A2; --water:#6DB3DB; --sand:#CDB873;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 'Source Serif 4',Georgia,'Times New Roman',serif}
.num,h1,h2,h3,.tab,.chip,.hbtn,.seg button,th,.big{font-family:'Barlow Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px 8px}
.top-in{max-width:560px;margin:0 auto}
.row{display:flex;align-items:center;gap:10px}
.back{border:0;background:var(--soft);border-radius:10px;padding:8px 12px;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:600}
h1{font-size:28px;line-height:1.1;margin:0;font-weight:700;letter-spacing:.2px}
h2{font-size:24px;margin:26px 0 8px;font-weight:700}
h3{font-size:19px;margin:0;font-weight:600}
p{margin:0 0 12px}
.mute{color:var(--mute)}
.seg{display:flex;gap:6px;margin-top:10px;overflow-x:auto;padding-bottom:2px}
.seg button{flex:1 0 auto;border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font-size:18px;font-weight:600;display:flex;align-items:center;gap:7px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.dot{width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(0,0,0,.35);display:inline-block;flex:none}
.tabs{display:flex;margin-top:10px;border-bottom:1px solid var(--line)}
.tab{flex:1;border:0;background:none;padding:8px 0;font-size:19px;font-weight:600;color:var(--mute);border-bottom:3px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:14px}
.course{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px}
.course.off{opacity:.55;cursor:default}
.course .big{font-size:24px;font-weight:700;line-height:1.15}
.hstrip{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px}
.hbtn{flex:0 0 auto;min-width:42px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);font-size:21px;font-weight:600;position:relative}
.hbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hbtn i{position:absolute;top:3px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--crit)}
.hhead{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.hnum{font-size:76px;line-height:.9;font-weight:700}
.hmeta{text-align:right;font-family:'Barlow Condensed',sans-serif}
.hmeta .y{font-size:44px;font-weight:700;line-height:1}
.hmeta .s{font-size:18px;color:var(--mute);font-weight:500}
svg.lad{width:100%;height:auto;display:block;margin-top:8px}
.lad .base{stroke:var(--line);stroke-width:5;stroke-linecap:round}
.lad .seg1{stroke:var(--accent);stroke-width:5;stroke-linecap:round}
.lad .mk{fill:var(--panel);stroke:var(--accent);stroke-width:3}
.lad text{fill:var(--ink);font-family:'Barlow Condensed',Arial,sans-serif;font-size:15px;font-weight:600;text-anchor:middle}
.lad text.lt{fill:var(--mute);font-weight:500}
.lad .flag{fill:var(--crit)}
.shots{margin:6px 0 0;padding:0;list-style:none}
.shots li{display:grid;grid-template-columns:84px 1fr auto;gap:8px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.shots li:first-child{border-top:0}
.shots .lab{font-family:'Barlow Condensed',sans-serif;font-size:18px;color:var(--mute);font-weight:600}
.shots .cl{font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:700;white-space:nowrap}
.shots .lf{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:600;text-align:right}
.haz{border-left:5px solid var(--low);padding:2px 0 2px 12px;margin:12px 0}
.haz.crit{border-color:var(--crit)}.haz.mod{border-color:var(--mod)}
.haz b{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;display:block}
.haz .sev{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;color:var(--mute)}
.note{font-size:16px;color:var(--mute)}
.aimnote{background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:12px}
.aimnote b{font-family:'Barlow Condensed',sans-serif;font-size:19px}
.pager{display:flex;gap:10px;margin-top:16px}
.pager button{flex:1;border:1.5px solid var(--line);background:var(--panel);border-radius:12px;padding:12px;font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:17px}
th{font-size:16px;text-align:left;color:var(--mute);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:baseline}
td.n,th.n{text-align:right}
td.num{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:600}
.bag{display:grid;grid-template-columns:1fr 72px 72px;gap:8px;align-items:center}
.bag input{width:100%;font:600 20px 'Barlow Condensed',Arial,sans-serif;padding:8px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);text-align:center}
.btn{border:1.5px solid var(--accent);background:none;color:var(--accent);border-radius:10px;padding:8px 14px;font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:600;margin-top:12px}
.dc li{margin:6px 0}
a{color:var(--accent)}
.warn{border:1.5px dashed var(--mod);border-radius:10px;padding:8px 12px;font-size:16px;margin-top:12px}
</style>
</head>

/* ============ ENGINE ============ */
/* Golfer: right-handed, relatively straight, 6'4" 185 lb.
   Bag: Ping G440 driver, 4 wood, 3 wood, 3 hybrid; TaylorMade P790 5 iron to A wedge; 54 and 58 degree wedges.
   Every distance below is an ASSUMPTION (total yards with roll, low to high). Edit them on any Summary page. */
var CLUB_ORDER=['drv','3w','4w','3h','5i','6i','7i','8i','9i','pw','aw','w54','w58'];
var DEFAULT_BAG={drv:[245,265],'3w':[228,242],'4w':[212,225],'3h':[198,210],'5i':[180,190],'6i':[170,178],'7i':[158,166],'8i':[146,154],'9i':[134,142],pw:[122,130],aw:[108,116],w54:[92,102],w58:[75,88]};
var CLUB_LABEL={drv:'Driver','3w':'3 wood','4w':'4 wood','3h':'3 hybrid','5i':'5 iron','6i':'6 iron','7i':'7 iron','8i':'8 iron','9i':'9 iron',pw:'Pitching wedge',aw:'A wedge',w54:'54 degree',w58:'58 degree'};
var CLUB_SHORT={drv:'Dr','3w':'3W','4w':'4W','3h':'3H','5i':'5i','6i':'6i','7i':'7i','8i':'8i','9i':'9i',pw:'PW',aw:'AW',w54:'54',w58:'58'};
var CLUB_BRAND={drv:'Ping G440','3w':'Ping G440','4w':'Ping G440','3h':'Ping G440','5i':'TaylorMade P790','6i':'TaylorMade P790','7i':'TaylorMade P790','8i':'TaylorMade P790','9i':'TaylorMade P790',pw:'TaylorMade P790',aw:'TaylorMade P790',w54:'Your wedge',w58:'Your wedge'};
var TEE_LIST=['drv','3w','4w','3h','5i','6i','7i','8i','9i','pw','aw'];
var APPROACH_LIST=['3w','4w','3h','5i','6i','7i','8i','9i','pw','aw','w54','w58'];
var LAYUP_LIST=['3w','4w','3h','5i','6i','7i','8i','9i','pw','aw'];
var LEAVE_MIN=90;      /* off the tee, never hit past the point that leaves less than this */
var LEAVE_TARGET=100;  /* a layup aims to leave about this many yards in */
var bag=JSON.parse(JSON.stringify(DEFAULT_BAG));
function lo(c){return bag[c][0]}
function mid(c){return (bag[c][0]+bag[c][1])/2}
/* Par goal goes for the green from a 5 iron distance. Bogey goal only from a 7 iron distance. */
function reach(){return state.goal==='par'?mid('5i'):mid('7i')}
function teeClub(hole,yds){
  if(hole.tee) return hole.tee;
  for(var i=0;i<TEE_LIST.length;i++){ if(mid(TEE_LIST[i])<=yds-LEAVE_MIN) return TEE_LIST[i]; }
  return 'aw';
}
function pickApproach(r,carry){
  if(carry){
    var ok=APPROACH_LIST.filter(function(c){return lo(c)>=r}).sort(function(a,b){return mid(a)-mid(b)});
    return ok[0]||'3w';
  }
  return APPROACH_LIST.slice().sort(function(a,b){return Math.abs(mid(a)-r)-Math.abs(mid(b)-r)})[0];
}
function plan(hole,yds){
  var shots=[],left=yds,pos=0;
  if(hole.par===3){
    var c=pickApproach(left,hole.carry);
    var d=hole.carry?lo(c):mid(c);
    shots.push({label:'Tee shot',club:c,dist:yds,cd:Math.round(d),isCarry:!!hole.carry,left:0,pos:yds,noclear:!!(hole.carry&&lo(c)<left)});
    return shots;
  }
  var tc=teeClub(hole,yds), td=mid(tc);
  left-=td; pos+=td;
  shots.push({label:'Tee shot',club:tc,dist:Math.round(td),left:Math.round(left),pos:pos});
  var n=0;
  while(left>reach()&&n<3){
    var cap=hole.secondMax||'3w', allowed=LAYUP_LIST.slice(LAYUP_LIST.indexOf(cap));
    var target=left-LEAVE_TARGET, pick=null;
    for(var i=0;i<allowed.length;i++){ if(mid(allowed[i])<=target){pick=allowed[i];break} }
    if(!pick) pick=allowed[allowed.length-1];
    var dd=mid(pick); left-=dd; pos+=dd; n++;
    shots.push({label:'Layup',club:pick,dist:Math.round(dd),left:Math.round(left),pos:pos});
  }
  var ac=pickApproach(left,false);
  shots.push({label:'Approach',club:ac,dist:Math.round(left),left:0,pos:yds});
  return shots;
}

   "The default tee is Blue: 6,568 yards at 70.9 / 121. Black is 7,041 yards at 73.0 / 124. The shorter sets (White about 5,970, Green, Red) are listed but their holes are missing.",
   "Hole 3 is a long par 3 over water that reviewers say backs up the whole course. The rest is scorecard only."
  ],
  "footnote": "Sources disagree on totals and ratings: the hole tables sum to 7,041 and 6,568, one tee list shows 7,023 and 6,607, and 18Birdies rates Black 74.1 / 132. Ratings shown are GolfPass's.",
  "dataCheck": {
   "confirmed": [],
   "approx": [
    "Black and Blue: yardage, par and handicap from GolfPass, with 18Birdies matching the Black card.",
    "The course site was not read."
   ],
   "unknown": [
    "Hole yardages for White (about 5,970), Green (about 5,243 to 5,342) and Red (4,973). A scorecard photo would add them.",
    "Water position on hole 3, and all hole shapes."
   ]
  },
  "links": [
   [
    "GolfPass scorecard",
    "https://www.golfpass.com/courses/15065-morris-williams-golf-course/scorecard-and-layout"
   ],
   [
    "18Birdies profile",
    "https://18birdies.com/golf-courses/club/8ca4b960-86ac-11e4-8c28-020000005b00/morris-williams"
   ]
  ],
  "H": {
   "3": {
    "carry": true,
    "haz": [
     [
      "crit",
      "Long par 3 over water",
      "Reviewers call it a long, challenging par 3 over water that causes backups. 218 from Black, 191 from Blue."
     ]
    ],
    "verify": "Confirm where the water sits and the front edge distance.",
    "aim": "Pick the club that carries and aim at the middle of the green. The water side is not verified."
   }
  }
 }
];

var ORDER=['plumcreek','kissing','greyrock','shadowglen','kizer','clay','lions','williams'];
COURSES.sort(function(a,b){return ORDER.indexOf(a.id)-ORDER.indexOf(b.id)});

/* ============ STATE ============ */
var state={view:'home',cid:null,tab:'summary',hole:1,tees:{},goal:'bogey'};
var KEY='austin-yardage-v2';
function save(){try{localStorage.setItem(KEY,JSON.stringify({bag:bag,tees:state.tees,cid:state.cid,hole:state.hole,tab:state.tab,view:state.view,goal:state.goal}))}catch(e){}}
function load(){try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){if(s.bag){for(var k in DEFAULT_BAG){if(s.bag[k])bag[k]=s.bag[k]}}state.tees=s.tees||{};if(s.goal==='par'||s.goal==='bogey')state.goal=s.goal;if(s.cid&&byId(s.cid)&&byId(s.cid).tees){state.cid=s.cid;state.view=s.view||'course';state.tab=s.tab||'summary';state.hole=s.hole||1}}}catch(e){}}
function byId(id){return COURSES.filter(function(c){return c.id===id})[0]}
function cur(){return byId(state.cid)}
function curTee(c){var n=state.tees[c.id]||c.homeTee;return c.tees.filter(function(t){return t.name===n})[0]||c.tees[0]}
function sum(a){return a.reduce(function(x,y){return x+y},0)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}

/* ============ VIEWS ============ */
function renderTop(){
  var t=document.getElementById('top');
  if(state.view==='home'){t.innerHTML='<h1>Austin Yardage Books</h1><div class="mute" style="font-size:15px">Club plans for a right-handed golfer who hits it straight</div>';return}
  var c=cur(),tee=curTee(c);
  var seg=c.tees.map(function(x){return '<button data-act="tee" data-v="'+x.name+'" aria-pressed="'+(x.name===tee.name)+'"><span class="dot" style="background:'+x.color+'"></span>'+x.name+' '+sum(x.y).toLocaleString()+'</button>'}).join('');
  t.innerHTML='<div class="row"><button class="back" data-act="home">Courses</button><h1>'+c.short+'</h1></div><div class="seg">'+seg+'</div>'+
   '<div class="tabs" role="tablist"><button class="tab" role="tab" data-act="tab" data-v="summary" aria-selected="'+(state.tab==='summary')+'">Summary</button><button class="tab" role="tab" data-act="tab" data-v="holes" aria-selected="'+(state.tab==='holes')+'">Holes</button></div>';
}
function homeView(){
  var h='<p class="mute" style="margin-top:16px">Pick a course. Plans use your club distances, which you can edit on each summary page.</p>';
  COURSES.forEach(function(c){
    if(c.tees){
      var t=curTee(c);
      h+='<button class="course" data-act="open" data-v="'+c.id+'"><div class="big">'+c.name+'</div><div class="mute" style="font-size:16px">Par '+sum(c.par)+', '+c.tees.length+' tees, '+t.name+' '+sum(t.y).toLocaleString()+' yards</div></button>';
    } else {
      h+='<div class="course off"><div class="big">'+c.name+'</div><div class="mute" style="font-size:16px">Not loaded yet</div></div>';
    }
  });
  return h;
}
function sevLabel(s){return s==='crit'?'Serious':s==='mod'?'Watch':'Minor'}
function holeObj(c,n){var h=c.H[n]||{};return {par:c.par[n-1],tee:h.tee,secondMax:h.secondMax,carry:h.carry,haz:h.haz,aim:h.aim,verify:h.verify}}
function goalOf(par){return state.goal==='par'?par:par+1}
function planAbbr(shots){return shots.map(function(s){return CLUB_SHORT[s.club]}).join(' then ')}

function summaryView(c){
  var tee=curTee(c),h='';
  h+='<h2>How it plays</h2>'+c.howItPlays.map(function(p){return '<p>'+esc(p)+'</p>'}).join('');
  h+='<p class="note">'+esc(c.footnote)+'</p>';
  h+='<div class="card"><h3>'+tee.name+' tees</h3><div class="mute">'+sum(tee.y).toLocaleString()+' yards, par '+sum(c.par)+', rating and slope '+tee.rating+'</div></div>';
  h+='<h2>Game plan</h2><div class="card" style="padding:6px 10px"><table><tr><th>Hole</th><th class="n">Par</th><th class="n">Yds</th><th>Plan</th><th class="n">Goal</th></tr>';
  for(var n=1;n<=18;n++){
    var ho=holeObj(c,n),yd=tee.y[n-1],sh=plan(ho,yd);
    h+='<tr><td class="num"><a href="#" data-act="gohole" data-v="'+n+'">'+n+'</a></td><td class="num n">'+ho.par+'</td><td class="num n">'+yd+'</td><td>'+planAbbr(sh)+'</td><td class="num n">'+goalOf(ho.par)+'</td></tr>';
  }
  h+='</table></div><div class="seg" style="margin-top:10px"><button data-act="goal" data-v="par" aria-pressed="'+(state.goal==='par')+'">Goal: par</button><button data-act="goal" data-v="bogey" aria-pressed="'+(state.goal==='bogey')+'">Goal: bogey</button></div><p class="note" style="margin-top:8px">Par goal goes for the green from about a 5 iron distance. Bogey goal lays up sooner. Tap a hole number to open its card.</p>';
  var dangers=[];
  for(var k=1;k<=18;k++){var hh=c.H[k];if(hh&&hh.haz){hh.haz.forEach(function(z){if(z[0]!=='low')dangers.push([k,z])})}}
  h+='<h2>Holes to respect</h2>';
  if(dangers.length){h+=dangers.map(function(d){return '<div class="haz '+d[1][0]+'"><b>Hole '+d[0]+': '+esc(d[1][1])+'</b><span class="note">'+esc(d[1][2])+'</span></div>'}).join('')}
  else h+='<p class="mute">None documented yet.</p>';
  h+='<h2>Your game</h2><p>Right-handed, hits it relatively straight, 6\'4" and 185 lb. Bag: Ping G440 driver, 4 wood, 3 wood and 3 hybrid; TaylorMade P790 5 iron through A wedge; 54 and 58 degree wedges. The default aim is the center of the fairway or green, and the plan picks the club that leaves a full wedge in rather than always taking the longest club.</p>';
  h+='<h2>Your distances</h2><div class="card"><p class="note">Assumed total yards with roll, low to high, for your height and weight. They are estimates, not measurements. Replace them with your real numbers and every plan updates.</p><div class="bag"><b></b><b class="note">Low</b><b class="note">High</b>';
  CLUB_ORDER.forEach(function(k){h+='<span>'+CLUB_LABEL[k]+'<br><span class="note" style="font-size:14px">'+CLUB_BRAND[k]+'</span></span><input inputmode="numeric" data-act="bag" data-club="'+k+'" data-i="0" value="'+bag[k][0]+'"><input inputmode="numeric" data-act="bag" data-club="'+k+'" data-i="1" value="'+bag[k][1]+'">'});
  h+='</div><button class="btn" data-act="bagreset">Reset to assumed distances</button></div>';
  h+='<h2>Data check</h2><div class="card dc"><b>Confirmed from the course</b><ul>'+(c.dataCheck.confirmed.length?c.dataCheck.confirmed.map(function(x){return '<li>'+esc(x)+'</li>'}).join(''):'<li>Nothing yet. The course\'s own scorecard has not been read.</li>')+'</ul><b>Approximate</b><ul>'+c.dataCheck.approx.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul><b>Unknown</b><ul>'+c.dataCheck.unknown.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div>';
  h+='<p class="note" style="margin-top:14px">Sources: '+c.links.map(function(l){return '<a href="'+l[1]+'" target="_blank" rel="noopener">'+l[0]+'</a>'}).join(', ')+'</p>';
  return h;
}

function ladder(shots,yds){
  var X0=16,X1=324,W=X1-X0,Y=40,s='<svg class="lad" viewBox="0 0 340 82" role="img" aria-label="Shot plan along the hole">';
  s+='<line class="base" x1="'+X0+'" y1="'+Y+'" x2="'+X1+'" y2="'+Y+'"/>';
  s+='<circle class="mk" cx="'+X0+'" cy="'+Y+'" r="7"/><text x="'+X0+'" y="'+(Y+28)+'">Tee</text>';
  shots.forEach(function(sh,i){
    var x=X0+W*Math.min(sh.pos,yds)/yds,last=i===shots.length-1;
    if(!last){
      s+='<circle class="mk" cx="'+x.toFixed(1)+'" cy="'+Y+'" r="7"/>';
      s+='<text x="'+x.toFixed(1)+'" y="'+(Y-16)+'">'+CLUB_SHORT[sh.club]+'</text>';
      if(X1-x>62) s+='<text class="lt" x="'+x.toFixed(1)+'" y="'+(Y+28)+'">'+sh.left+' left</text>';
    }
  });
  s+='<path class="flag" d="M'+X1+' '+(Y-26)+' L'+(X1+14)+' '+(Y-20)+' L'+X1+' '+(Y-14)+' Z"/><line x1="'+X1+'" y1="'+(Y-26)+'" x2="'+X1+'" y2="'+Y+'" stroke="var(--ink)" stroke-width="2"/>';
  s+='<text x="'+(X1-6)+'" y="'+(Y+28)+'">'+yds+'</text></svg>';
  return s;
}
function holeView(c){
  var n=state.hole,tee=curTee(c),yd=tee.y[n-1],ho=holeObj(c,n),sh=plan(ho,yd),h='';
  var strip=''; for(var i=1;i<=18;i++){var hz=c.H[i]&&c.H[i].haz&&c.H[i].haz.some(function(z){return z[0]==='crit'});strip+='<button class="hbtn" data-act="gohole" data-v="'+i+'" aria-pressed="'+(i===n)+'">'+i+(hz?'<i></i>':'')+'</button>'}
  h+='<div class="hstrip">'+strip+'</div>';
  h+='<div class="card"><div class="hhead"><div class="hnum">'+n+'</div><div class="hmeta"><div class="y">'+yd+' yds</div><div class="s">Par '+ho.par+', handicap '+c.hcp[n-1]+', goal '+goalOf(ho.par)+'</div></div></div>';
  h+=ladder(sh,yd);
  h+='<ul class="shots">'+sh.map(function(s){
    var last=s===sh[sh.length-1];
    var cl=CLUB_LABEL[s.club]; var d=(s.cd)?(s.isCarry?' carries ':' about ')+s.cd:(last?'':' about '+s.dist);
    return '<li><span class="lab">'+s.label+'</span><span class="cl">'+cl+'<span class="note" style="font-size:17px;font-weight:500;display:block">'+d+'</span></span><span class="lf">'+(last?s.dist+' to the pin':s.left+' left')+'</span></li>';
  }).join('')+'</ul>';
  if(ho.carry){ if(sh[0].noclear) h+='<div class="warn"><b>Long carry:</b> even the short end of your longest club does not clearly cover this. Consider a safe play short of the hazard and a chip or pitch from there.</div>'; else h+='<p class="note" style="margin-top:6px">Water or sand in front, so the club is picked to carry on the short end of your range.</p>'; }
  h+='</div>';
  if(ho.haz){h+='<div class="card">'+ho.haz.map(function(z){return '<div class="haz '+z[0]+'"><span class="sev">'+sevLabel(z[0])+'</span><b>'+esc(z[1])+'</b><span class="note">'+esc(z[2])+'</span></div>'}).join('')+'</div>'}
  var aim=ho.aim||(ho.par===3?'Aim at the middle of the green.':'Default aim: the center of the fairway. Hole shape is not mapped yet, so check for trouble from the tee.');
  h+='<div class="aimnote"><b>Aim note</b><br>'+esc(aim)+'</div>';
  if(ho.verify) h+='<div class="warn"><b>Check on the day:</b> '+esc(ho.verify)+'</div>';
  h+='<div class="note" style="margin-top:12px">Overhead map not drawn yet for this hole. Send a satellite screenshot and it can be added.</div>';
  h+='<div class="pager"><button data-act="prev"'+(n===1?' disabled style="opacity:.4"':'')+'>'+(n===1?'First hole':'Hole '+(n-1))+'</button><button data-act="next"'+(n===18?' disabled style="opacity:.4"':'')+'>'+(n===18?'Last hole':'Hole '+(n+1))+'</button></div>';
  return h;
}
function render(keepScroll){
  var y=window.scrollY;
  renderTop();
  var app=document.getElementById('app');
  if(state.view==='home') app.innerHTML=homeView();
  else { var c=cur(); app.innerHTML=state.tab==='summary'?summaryView(c):holeView(c); }
  var sg=document.querySelector('.seg'),sel=document.querySelector('.seg [aria-pressed="true"]');
  if(sg&&sel) sg.scrollLeft=Math.max(0,sel.offsetLeft-sg.offsetLeft-8);
  window.scrollTo(0,keepScroll?y:0);
  save();
}

/* ============ EVENTS ============ */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el||el.tagName==='INPUT') return;
  var a=el.getAttribute('data-act'),v=el.getAttribute('data-v');
  if(a==='gohole'||a==='tab'||a==='open') e.preventDefault();
  if(a==='open'){state.cid=v;state.view='course';state.tab='summary';render()}
  else if(a==='home'){state.view='home';render()}
  else if(a==='tab'){state.tab=v;render()}
  else if(a==='tee'){state.tees[state.cid]=v;render(true)}
  else if(a==='gohole'){state.hole=+v;state.tab='holes';render()}
  else if(a==='prev'){if(state.hole>1){state.hole--;render()}}
  else if(a==='next'){if(state.hole<18){state.hole++;render()}}
  else if(a==='goal'){state.goal=v;render(true)}
  else if(a==='bagreset'){bag=JSON.parse(JSON.stringify(DEFAULT_BAG));render(true)}
});
document.addEventListener('change',function(e){
  var el=e.target; if(el.getAttribute('data-act')!=='bag') return;
  var k=el.getAttribute('data-club'),i=+el.getAttribute('data-i'),val=parseInt(el.value,10);
  if(isNaN(val)||val<40||val>340){render(true);return}
  bag[k][i]=val; if(bag[k][0]>bag[k][1]){var t=bag[k][0];bag[k][0]=bag[k][1];bag[k][1]=t}
  render(true);
});
var tx=null;
document.addEventListener('touchstart',function(e){tx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',function(e){
  if(tx===null||state.view!=='course'||state.tab!=='holes') return;
  var dx=e.changedTouches[0].clientX-tx; tx=null;
  if(e.target.closest('.hstrip')) return;
  if(dx<-70&&state.hole<18){state.hole++;render()} else if(dx>70&&state.hole>1){state.hole--;render()}
},{passive:true});

load(); render();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
if(typeof module!=='undefined'){module.exports={plan:plan,COURSES:COURSES,bag:bag}}
</script>
</body>
</html>
